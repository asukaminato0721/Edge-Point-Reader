<div class="card-content">
    <div class="id"> {{id}} </div>
    <div class="kanji">{{kanji}}</div>
    <div class="sentence">{{setence}}</div>
</div>

<div id="epr-anki">
  <div hidden data-text="id">{{id}}</div>
  <div hidden data-text="sentence">{{setence}}</div>

  <button type="button" data-read="id">🔊 单词</button>
  <button type="button" data-read="sentence">🔊 例句</button>
  <div data-status role="status"></div>
  <audio controls preload="none"></audio>
</div>

<script>
(() => {
  const ENDPOINT = "https://edge-point-reader.wuyudi1109.workers.dev/tts";
  const TOKEN = "db%2BpH5Iol3zO"; // 已配置鉴权时，填油猴中的同一个 API_TOKEN

  const root = document.getElementById("epr-anki");
  const player = root.querySelector("audio");
  const status = root.querySelector("[data-status]");
  const buttons = root.querySelectorAll("[data-read]");
  const controller = new AbortController();
  let objectUrl = "";

  function extractMp3(buffer) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);
    const parts = [];

    for (let p = 0; p < bytes.length;) {
      if (p + 5 > bytes.length) throw new Error("音频帧不完整");
      const type = bytes[p];
      const size = view.getUint32(p + 1, false);
      p += 5;
      if (![1, 2, 3].includes(type) || size > bytes.length - p) {
        throw new Error("音频帧无效");
      }
      if (type === 1) parts.push(bytes.subarray(p, p + size));
      p += size;
    }

    const blob = new Blob(parts, { type: "audio/mpeg" });
    if (!blob.size) throw new Error("没有收到音频");
    return blob;
  }

  buttons.forEach(button => {
    button.onclick = async () => {
      const node = root.querySelector(
        '[data-text="' + button.dataset.read + '"]'
      ).cloneNode(true);

      // 从 HTML 读取文字，去掉 ruby 注音，避免重复朗读。
      node.querySelectorAll(
        "rt,rp,script,style,noscript,[aria-hidden=true]"
      ).forEach(el => el.remove());
      node.querySelectorAll("br").forEach(el => el.replaceWith("\n"));
      const text = node.textContent.trim();

      if (!text) return;
      if (new TextEncoder().encode(text).length > 4000) {
        status.textContent = "文本超过 4000 UTF-8 字节，请缩短例句。";
        return;
      }

      buttons.forEach(b => b.disabled = true);
      player.pause();
      status.textContent = "正在生成音频…";

      try {
        const headers = { "Content-Type": "application/json" };
        if (TOKEN) headers.Authorization = "Bearer " + TOKEN;

        const response = await fetch(ENDPOINT, {
          method: "POST",
          headers,
          credentials: "omit",
          signal: controller.signal,
          body: JSON.stringify({
            text,
            provider: "microsoft-translator",
            voice: "ja-JP-MayuNeural",
            rate: "-20%",
            pitch: "+0st",
            semantic: false
          })
        });

        if (!response.ok) {
          throw new Error(
            "HTTP " + response.status + ": " + await response.text()
          );
        }
        if (!(response.headers.get("Content-Type") || "")
          .includes("application/vnd.edge-point-reader.timed-stream")) {
          throw new Error("Worker 返回了非预期格式");
        }

        const blob = extractMp3(await response.arrayBuffer());
        if (!root.isConnected) return;
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(blob);
        player.src = objectUrl;
        status.textContent = "";

        try {
          await player.play();
        } catch {
          status.textContent = "音频已就绪，请点击播放器播放。";
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          status.textContent = "朗读失败：" + error.message;
        }
      } finally {
        buttons.forEach(b => b.disabled = false);
      }
    };
  });

  // 切换卡片后停止请求和播放，释放临时音频。
  const observer = new MutationObserver(() => {
    if (root.isConnected) return;
    controller.abort();
    player.pause();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    observer.disconnect();
  });
  observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
